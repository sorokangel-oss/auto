# 이 저장소는 순수 정적 페이지(index.html)라 빌드가 필요 없다.
#
# 주의: command 키를 아예 생략하면, Netlify 사이트 대시보드(Site settings ->
# Build & deploy -> Build command)에 예전에 설정된 값이 그대로 적용된다.
# 이 저장소의 경우 UI 쪽에 남아있던 "hugo" 명령이 그대로 실행되어
# `hugo: command not found` 에러가 발생했다 (commandOrigin: ui).
# 그래서 아무 것도 하지 않는 안전한 명령(`true`)을 명시적으로 지정해
# UI에 남아있는 값을 확실히 덮어쓴다.
[build]
  command = "true"
  publish = "."
