# 네이버 블로그 자동 포스팅 설정
# 네이버 아이디/비밀번호, API 키는 여기가 아니라 .env 파일에 넣으세요.

blog_id: ""  # .env의 NAVER_BLOG_ID를 쓰지 않을 경우 여기에 직접 입력 가능

# 브라우저를 화면 없이(headless) 실행할지 여부.
# 로그인은 항상 headed(화면 있음)로 진행되며, 이 옵션은 post-now/run-scheduler에만 적용됩니다.
headless: true

# 스케줄러가 무작위로 골라 쓸 주제 목록
topics:
  - "오늘의 집밥 레시피"
  - "주말 나들이 코스 추천"
  - "요즘 읽을 만한 책 추천"
  - "생산성을 높이는 작은 습관"

# 발행 스케줄 (매일 반복)
schedule:
  times:
    - "09:00"
  timezone: "Asia/Seoul"

# 글 생성 옵션
content:
  language: "ko"
  min_length: 800
  tone: "친근하고 정보 전달이 명확한 블로그 톤"
